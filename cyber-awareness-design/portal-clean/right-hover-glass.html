/* FINAL POLISH: left nav glass hover animation */
.nav-drawer{
  overflow:hidden!important;
  background:
    radial-gradient(circle at 20% 0%, rgba(0,229,255,.16), transparent 34%),
    linear-gradient(180deg,rgba(15,23,42,.78),rgba(15,23,42,.52))!important;
  backdrop-filter:blur(30px) saturate(180%)!important;

}
.nav-drawer:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg,rgba(255,255,255,.18),transparent 30%,rgba(0,229,255,.08)),

}

  content:"";

  animation:navGlassSweep 7s ease-in-out infinite;
  pointer-events:none;
}

.nav-content{position:relative!important;z-index:2!important}
.nav-buttons button{
  position:relative!important;
  overflow:hidden!important;
  backdrop-filter:blur(16px)!important;

  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)!important;
}

const data={users:4,modules:12,campaigns:3,completion:84,click:6.8,report:47};
function renderNav(){navBtns.innerHTML=nav.map(n=>`<button class="${current===n[0]?'active':''}" onclick="current='${n[0]}';render()"><i>${n[1]}</i><span>${n[2]}</span></button>`).join('')}
function render(){renderNav();const label=nav.find(n=>n[0]===current)[2];title.textContent=label;subtitle.textContent=subtitles[current]||'Clean glassmorphic workspace.';actions.innerHTML=actionHTML();pages.innerHTML=views[current]();bind()}
const subtitles={dashboard:'Overview of training, phishing, user risk and compliance.',training:'View-only protected modules and learning paths.',phishing:'Schedule safe simulations and assign users.',users:'Manage users, roles, departments and risk.',reports:'Dashboard and user-level reporting.',settings:'Portal configuration with clean controls.'};
function actionHTML(){if(current==='phishing')return '<button class="btn ghost" onclick="toast(\'Draft saved\')">Save Draft</button><button class="btn" onclick="toast(\'Campaign scheduled\')">Schedule</button>';if(current==='reports')return '<button class="btn ghost" onclick="toast(\'CSV export started\')">Export CSV</button><button class="btn" onclick="toast(\'PDF export started\')">Export PDF</button>';if(current==='settings')return '<button class="btn ghost" onclick="toast(\'Reset done\')">Reset</button><button class="btn" onclick="toast(\'Settings saved\')">Save</button>';return ''}

const views={dashboard:()=>`<div class="grid metrics">${metric('Training Completion',data.completion+'%')}${metric('Active Users',data.users)}${metric('Phish Click Rate',data.click+'%')}${metric('Report Rate',data.report+'%')}</div><div class="dash-layout"><div class="glass panel chart-card"><div class="chart-head"><h2>Awareness Trend</h2><div class="seg"><button class="active" data-range="7">7D</button><button data-range="30">30D</button><button data-range="90">90D</button></div></div><div class="chart-wrap"><canvas id="trendChart"></canvas></div></div><div class="glass panel chart-card"><div class="chart-head"><h2>Human Risk Split</h2></div><div class="donut-wrap"><div class="donut"><span>82<br><small style="font-size:12px;color:var(--muted)">Cyber Score</small></span></div></div><div class="legend"><div class="legend-item"><span><i style="background:var(--green)"></i>Safe users</span><b>47%</b></div><div class="legend-item"><span><i style="background:var(--gold)"></i>Needs coaching</span><b>27%</b></div><div class="legend-item"><span><i style="background:var(--red)"></i>High risk</span><b>7%</b></div></div></div></div><div class="dash-layout"><div class="glass panel"><div class="chart-head"><h2>Department Performance</h2></div><div class="bars"><div class="bar-row"><span>Finance</span><div class="bar-track"><div class="bar-fill" style="width:62%"></div></div><b>62%</b></div><div class="bar-row"><span>HR</span><div class="bar-track"><div class="bar-fill" style="width:78%"></div></div><b>78%</b></div><div class="bar-row"><span>IT</span><div class="bar-track"><div class="bar-fill" style="width:94%"></div></div><b>94%</b></div><div class="bar-row"><span>Sales</span><div class="bar-track"><div class="bar-fill" style="width:71%"></div></div><b>71%</b></div><div class="bar-row"><span>Ops</span><div class="bar-track"><div class="bar-fill" style="width:83%"></div></div><b>83%</b></div></div></div><div class="glass panel"><h2>Risk Heatmap</h2><div class="heatmap">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun','HR','Fin','IT','Ops','Sales','Mgmt','CX','Low','Med','High','Low','Med','Low','High'].map((x,i)=>`<div class="heat ${i%7===2?'risk-high':i%3===0?'risk-med':'risk-low'}">${x}</div>`).join('')}</div></div></div><div class="dash-layout"><div class="glass panel"><h2>User Risk Leaderboard</h2><table class="user-risk-table"><tr><th>User</th><th>Dept</th><th>Score</th><th>Status</th></tr><tr><td>Asha Rao</td><td>Finance</td><td>82</td><td><span class="tag warn">Coaching</span></td></tr><tr><td>Priya Nair</td><td>Sales</td><td>61</td><td><span class="tag bad">High</span></td></tr><tr><td>Rohit Mehta</td><td>IT</td><td>94</td><td><span class="tag">Safe</span></td></tr></table></div><div class="glass panel"><h2>Smart Insights</h2><div class="insights"><div class="insight"><b>Finance risk increased</b><small>Vendor fraud templates had 2.1x higher click rate. Assign refresher microlearning.</small></div><div class="insight"><b>Reporting improved</b><small>Average reporting time reduced from 32 minutes to 18 minutes.</small></div><div class="insight"><b>DPDPA pending</b><small>11 users have not completed data protection training.</small></div></div></div></div>`,training:()=>`<div class="module-grid">${['DPDPA Awareness|🇮🇳|#1e5d9e','Phishing Basics|🎣|#ff5847','RBI/BFSI Awareness|🏦|#111827','NIST CSF Basics|🧭|#4338ca','Mobile Scams|📱|#0f766e','Red/Blue Team|⚔️|#be123c'].map(x=>{let [t,e,c]=x.split('|');return `<article class="glass module"><div class="cover" style="background:${c}"><strong>${t.split(' ')[0]}<br>${t.split(' ')[1]||''}</strong><em>${e}</em></div><div class="body"><b>${t}</b><span>Interactive Module • View only</span></div></article>`}).join('')}</div><div class="assign-grid"><div class="glass panel"><h2>Module Content Library</h2><div class="module-detail"><div class="module-row"><span class="micon">🎣</span><div><b>Phishing Basics</b><small>Video 6 min + interactive red flag lens + 5 question quiz. Covers sender, links, urgency and reporting.</small></div><span class="tag">Beginner</span></div><div class="module-row"><span class="micon">📜</span><div><b>DPDPA Awareness</b><small>Interactive module 8 min + breach timer scenario. Covers personal data, safe sharing and immediate reporting.</small></div><span class="tag warn">Compliance</span></div><div class="module-row"><span class="micon">📱</span><div><b>Mobile, WhatsApp and OTP Fraud</b><small>Video 7 min + scenario quiz. Covers smishing, fake manager messages, OTP and UPI scams.</small></div><span class="tag">Mobile</span></div><div class="module-row"><span class="micon">🏦</span><div><b>RBI / SEBI Regulatory Awareness</b><small>Role-based module for BFSI and market teams. Covers customer data, payment fraud and incident escalation.</small></div><span class="tag warn">Role</span></div></div></div><div class="glass panel"><h2>Assign Selected Module</h2><form class="form"><select id="assignModule"><option>Phishing Basics</option><option>DPDPA Awareness</option><option>Mobile, WhatsApp and OTP Fraud</option><option>RBI / SEBI Regulatory Awareness</option></select><div class="audience-tabs"><button type="button" class="active" data-aud="all">All Users</button><button type="button" data-aud="dept">Departments</button><button type="button" data-aud="users">Specific Users</button><button type="button" data-aud="me">Only Me</button></div><div class="assign-box" id="assignAudience"><b>All Users</b><p style="color:var(--muted);line-height:1.55;margin:8px 0 0">This module will be assigned to every active learner in the tenant.</p></div><select><option>Due in 7 days</option><option>Due in 14 days</option><option>Due in 30 days</option></select><button type="button" class="btn" onclick="toast('Module assigned to selected audience')">Assign Module</button></form></div></div>`,phishing:()=>`<div class="grid two"><div class="glass panel"><h2>Campaign Schedule</h2><form class="form"><input value="Password Expiry Simulation - July"><select><option>Password Expiry</option><option>Vendor Bank Change</option><option>DPDPA Audit Request</option><option>QR Phishing</option></select><input type="date" value="2026-07-30"><input type="time" value="10:30"><input value="training.customer-domain.com"><textarea>Consent note: approved internal simulation. No real credentials collected.</textarea></form><div class="audience-tabs"><button type="button" class="active" data-caud="all">All Users</button><button type="button" data-caud="dept">Departments</button><button type="button" data-caud="users">Specific Users</button><button type="button" data-caud="me">Only Me</button></div><div class="assign-box" id="campaignAudience"><b>Campaign Audience: All Users</b><p style="color:var(--muted);line-height:1.55;margin:8px 0 0">Simulation will be sent to all active users after consent approval.</p></div></div><div class="glass panel"><h2>Auto-Redirect After Phish Click</h2><form class="form"><select id="redirectType"><option>Redirect to Training Landing Page</option><option>Redirect to Video Training</option><option>Redirect to Interactive Module</option><option>Redirect to Quiz / Microlearning</option></select><select><option>Phishing Basics</option><option>Red Flag Lens Interactive</option><option>Password, OTP and MFA Safety</option><option>DPDPA Breach Reporting</option></select><label class="check-line"><span>Auto-assign remedial module when user clicks</span><input type="checkbox" checked></label><label class="check-line"><span>Notify manager for repeated clickers</span><input type="checkbox"></label><button type="button" class="btn" onclick="toast('Auto-redirect and remedial training saved')">Save Redirect Rule</button></form></div></div><div class="glass panel" style="margin-top:18px"><h2>Safe Phishing Flow</h2><div class="flow"><div class="flow-step"><b>1. Email Sent</b><small style="color:var(--muted)">Approved template/domain</small></div><div class="flow-step"><b>2. User Clicks</b><small style="color:var(--muted)">Event safely tracked</small></div><div class="flow-step"><b>3. Auto Redirect</b><small style="color:var(--muted)">Video or interactive module</small></div><div class="flow-step"><b>4. Report Updated</b><small style="color:var(--muted)">User risk and training status</small></div></div><div class="remediation" style="margin-top:16px"><div class="rem-card"><b>Video Training</b><small>5–7 minute explainer immediately after click.</small></div><div class="rem-card"><b>Interactive Module</b><small>Red Flag Lens exercise where user clicks warning signs.</small></div><div class="rem-card"><b>Micro Quiz</b><small>3 questions before returning to dashboard.</small></div></div></div>`,users:()=>`<div class="glass panel"><h2>User Directory</h2><div class="row">Asha Rao — Finance <span class="tag warn">Medium Risk</span></div><div class="row">Rohit Mehta — IT Admin <span class="tag">Low Risk</span></div><div class="row">Meera Shah — HR Manager <span class="tag">Low Risk</span></div><div class="row">Priya Nair — Sales <span class="tag bad">High Risk</span></div></div>`,company:()=>`<div class="grid two"><div class="glass panel"><h2>Branding</h2><form class="form"><input value="Kavach360 Cyber Academy"><input value="#00e5ff"><input value="#8b5cf6"></form></div><div class="glass panel"><h2>Domains</h2><div class="row">training.company.com <span class="tag">Verified</span></div><div class="row">smtp.company.com <span class="tag">Verified</span></div></div></div>`,licences:()=>`<div class="grid metrics">${metric('Plan','Pro')}${metric('Users','2450')}${metric('Expiry','127d')}${metric('Trial','Extend')}</div>`,reports:()=>`<div class="grid metrics">${metric('Training','84%')}${metric('Click Rate','6.8%')}${metric('Report Rate','47%')}${metric('Avg Time','18m')}</div><br><div class="grid two"><div class="glass panel"><h2>Individual User Report</h2><div class="row">Asha Rao — Cyber Score <span>82</span></div><div class="row">Training completed <span>9 / 11</span></div><div class="row">Phishing clicked <span class="tag warn">1 / 5</span></div></div><div class="glass panel"><h2>Department Risk</h2><div class="row">Finance <span class="tag bad">High</span></div><div class="row">HR <span class="tag warn">Medium</span></div><div class="row">IT <span class="tag">Low</span></div></div></div>`,policies:()=>`<div class="glass panel"><h2>Policy Acknowledgement</h2><div class="row">Acceptable Use Policy <span class="tag">Published</span></div><div class="row">Data Retention Policy <span class="tag warn">Review</span></div><div class="row">Incident Reporting Policy <span class="tag">Published</span></div></div>`,settings:()=>`<div class="grid two"><div class="glass panel"><h2>Theme</h2><form class="form"><input value="#00e5ff"><input value="#8b5cf6"><select><option>Glass Cyber</option><option>Premium Gold</option><option>Light</option></select></form></div><div class="glass panel"><h2>SMTP & Security</h2><div class="row">SMTP Host <span>smtp.company.com</span></div><div class="row">Content download disabled <span class="tag">On</span></div><div class="row">MFA for admins <span class="tag">On</span></div></div></div>`};

function drawTrend(range=7){
 const canvas=document.getElementById('trendChart'); if(!canvas)return; const ctx=canvas.getContext('2d'); const dpr=window.devicePixelRatio||1; const r=canvas.getBoundingClientRect(); canvas.width=r.width*dpr; canvas.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); const w=r.width,h=r.height; ctx.clearRect(0,0,w,h);
 const points = range==7 ? [58,62,64,69,72,78,84] : range==30 ? [42,45,48,50,53,55,58,61,63,64,66,68,69,72,73,75,76,78,80,81,82,84] : [31,35,38,41,45,48,52,55,59,62,66,70,74,77,80,84];
 const pad=28, max=100, min=20; ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=1; ctx.font='12px Inter, sans-serif'; ctx.fillStyle='rgba(219,234,254,.72)'; for(let i=0;i<4;i++){let y=pad+(h-pad*2)*i/3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();ctx.fillText(String(100-i*25)+'%',4,y+4)}
 const x=i=>pad+(w-pad*2)*i/(points.length-1); const y=v=>pad+(h-pad*2)*(1-(v-min)/(max-min)); const grad=ctx.createLinearGradient(0,0,w,0); grad.addColorStop(0,'#00e5ff'); grad.addColorStop(.55,'#8b5cf6'); grad.addColorStop(1,'#ec4899'); ctx.strokeStyle=grad; ctx.lineWidth=3; ctx.beginPath(); points.forEach((v,i)=>{i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v))}); ctx.stroke();
 const fill=ctx.createLinearGradient(0,pad,0,h-pad); fill.addColorStop(0,'rgba(0,229,255,.22)'); fill.addColorStop(1,'rgba(139,92,246,0)'); ctx.lineTo(w-pad,h-pad); ctx.lineTo(pad,h-pad); ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
 points.forEach((v,i)=>{ctx.beginPath();ctx.arc(x(i),y(v),4,0,Math.PI*2);ctx.fillStyle='#07111f';ctx.fill();ctx.strokeStyle=grad;ctx.lineWidth=2;ctx.stroke()});
}
function bind(){drawTrend(7);document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawTrend(+b.dataset.range)});document.querySelectorAll('[data-aud]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-aud]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const box=document.getElementById('assignAudience');const map={all:['All Users','This module will be assigned to every active learner in the tenant.'],dept:['Departments','Choose departments such as Finance, HR, IT, Sales or Operations.'],users:['Specific Users','Select individual users who need this module or refresher training.'],me:['Only Me','Assign this module only to the current logged-in user for testing.']};box.innerHTML=`<b>${map[b.dataset.aud][0]}</b><p style="color:var(--muted);line-height:1.55;margin:8px 0 0">${map[b.dataset.aud][1]}</p>`});document.querySelectorAll('[data-caud]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-caud]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const box=document.getElementById('campaignAudience');const map={all:['Campaign Audience: All Users','Simulation will be sent to all active users after consent approval.'],dept:['Campaign Audience: Departments','Send only to selected departments such as Finance, HR or IT.'],users:['Campaign Audience: Specific Users','Send only to selected users for targeted testing.'],me:['Campaign Audience: Only Me','Send to current admin only for test and preview.']};box.innerHTML=`<b>${map[b.dataset.caud][0]}</b><p style="color:var(--muted);line-height:1.55;margin:8px 0 0">${map[b.dataset.caud][1]}</p>`});document.querySelectorAll('.glass').forEach(el=>{el.onpointermove=e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(900px) rotateX(${-y*1.8}deg) rotateY(${x*2.2}deg) translateY(-2px)`};el.onpointerleave=()=>el.style.transform=''})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
render();
addEventListener('resize',()=>drawTrend(document.querySelector('.seg button.active')?.dataset.range||7));

// left nav glass hover pointer lighting
(function(){
  const nav = document.querySelector('.nav-drawer');
  if(!nav) return;
  nav.addEventListener('pointermove', e=>{
    const r=nav.getBoundingClientRect();
    nav.style.setProperty('--nav-mx', ((e.clientX-r.left)/r.width*100)+'%');
    nav.style.setProperty('--nav-my', ((e.clientY-r.top)/r.height*100)+'%');
  });
  document.querySelectorAll('.nav-buttons button').forEach(btn=>{
    btn.addEventListener('pointermove', e=>{
      const r=btn.getBoundingClientRect();
      btn.style.setProperty('--btn-mx', ((e.clientX-r.left)/r.width*100)+'%');
      btn.style.setProperty('--btn-my', ((e.clientY-r.top)/r.height*100)+'%');
    });
  });
})();
