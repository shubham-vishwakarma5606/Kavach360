<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kavach360 Functional MVP</title>
<style>
:root{--bg:#070a02;--side:#25283b;--sub:#1f2234;--panel:#282b40;--field:#202337;--text:#fff;--muted:#cbd0df;--muted2:#9299ad;--accent:#ff5847;--line:rgba(255,255,255,.09);--ok:#22c55e;--warn:#f97316;--bad:#ef4444;--shadow:0 14px 34px rgba(0,0,0,.34);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 220px 1fr;grid-template-rows:72px 1fr;height:100vh}.side{grid-row:1/3;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--line)}.brand{height:72px;display:flex;align-items:center;gap:18px;padding:0 18px}.hamb{width:34px;display:grid;gap:6px}.hamb i{height:3px;background:#fff;border-radius:99px}.logo{width:58px;height:35px;background:#fff;color:#5b21b6;border-radius:3px;display:grid;place-items:center;text-align:center;line-height:1.05;font-size:8px;font-weight:1000}.nav{display:grid;padding-top:26px}.nav button{height:68px;border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:21px;padding:0 24px;font-size:17px;text-align:left;position:relative}.nav button:hover{background:rgba(255,255,255,.04)}.nav button.active{background:rgba(255,88,71,.66)}.nav button.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}.ico{font-size:27px;width:30px;text-align:center}.utils{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:9px}.util{border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;border-radius:8px;padding:10px 12px;text-align:left;font-weight:800}.sub{grid-row:1/3;background:var(--sub);border-right:1px solid var(--line)}.sub h3{height:72px;margin:0;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line)}.subnav{display:grid;gap:7px;padding:14px 10px}.subnav button{height:44px;border:0;border-radius:8px;background:transparent;color:#d8dbea;text-align:left;padding:0 13px;font-weight:750}.subnav button.active,.subnav button:hover{background:rgba(255,88,71,.66);color:#fff}.top{grid-column:3;background:var(--side);display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line)}.crumb{color:var(--muted2);font-weight:800}.main{grid-column:3;overflow:auto}.head{height:104px;background:#080d02;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.head h1{margin:0;font-size:42px;font-weight:500}.actions{display:flex;gap:10px}.content{padding:26px 32px 54px}.btn{border:0;border-radius:7px;padding:10px 15px;font-weight:900;color:#fff;background:var(--accent)}.btn.dark{background:#000}.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line)}.btn.small{padding:7px 10px;font-size:12px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.panel{padding:20px}.panel h2{margin:0 0 15px}.grid{display:grid;gap:20px}.metrics{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.05fr .95fr}.three{grid-template-columns:repeat(3,1fr)}.metric{padding:20px}.metric span{color:var(--muted2);font-size:12px;text-transform:uppercase;font-weight:900}.metric b{display:block;font-size:32px;margin-top:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.tag{font-size:12px;border-radius:99px;padding:5px 9px;background:rgba(34,197,94,.15);color:#bbf7d0;font-weight:900}.tag.warn{background:rgba(249,115,22,.16);color:#fed7aa}.tag.bad{background:rgba(239,68,68,.16);color:#fecaca}.form{display:grid;gap:12px}.form input,.form select,.form textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;color:#fff;padding:12px;outline:none}.form textarea{min-height:90px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted2);font-size:12px;text-transform:uppercase;padding:10px}.table td{padding:12px 10px;border-top:1px solid var(--line)}.modules{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:22px}.module{background:var(--panel);border-radius:7px;overflow:hidden;min-height:220px;box-shadow:var(--shadow);position:relative}.cover{height:108px;position:relative}.cover strong{position:absolute;left:14px;top:13px;font-size:21px;line-height:1.05}.cover em{position:absolute;right:16px;bottom:10px;font-style:normal;font-size:38px}.body{padding:17px}.body b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body span{display:block;margin-top:8px;color:#dde1ef;font-size:14px}.notice{margin-top:20px;border-left:4px solid var(--accent);background:rgba(255,255,255,.05);padding:14px;border-radius:8px;color:#e8eaf4;line-height:1.55}.checks{display:grid;gap:8px}.check{display:flex;gap:9px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px}.toast{position:fixed;right:24px;top:86px;background:var(--ok);color:#04130a;border-radius:8px;padding:12px 15px;font-weight:900;opacity:0;transform:translateY(-12px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;place-items:center;z-index:60;padding:20px}.modal.show{display:grid}.modalbox{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}.close{float:right}.danger{color:#fecaca}@media(max-width:1100px){.app{grid-template-columns:215px 190px 1fr}.metrics,.two,.three{grid-template-columns:1fr}.modules{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){body{overflow:auto}.app{display:block;height:auto}.side{position:sticky;top:0;z-index:10}.nav{display:flex;overflow:auto;padding:0}.nav button{min-width:110px;height:70px;flex-direction:column;justify-content:center;gap:4px;font-size:13px;padding:8px}.utils{display:none}.sub{position:sticky;top:70px;z-index:9}.sub h3{display:none}.subnav{display:flex;overflow:auto}.subnav button{min-width:135px;text-align:center}.top{display:none}.main{overflow:visible}.head,.content{padding-left:18px;padding-right:18px}.modules{grid-template-columns:1fr}.head h1{font-size:32px}}
</style>
</head><body oncontextmenu="return false">
<div class="app"><aside class="side"><div class="brand"><span class="hamb"><i></i><i></i><i></i></span><div class="logo">KAVACH<br>360</div></div><nav class="nav" id="mainNav"></nav><div class="utils"><button class="util" onclick="exportDB()">⬇ Export DB</button><button class="util" onclick="resetDB()">↻ Reset Demo DB</button><div class="util">👤 Admin User</div></div></aside><aside class="sub"><h3 id="subTitle">Dashboard</h3><nav class="subnav" id="subNav"></nav></aside><header class="top"><div class="crumb" id="crumb">Dashboard / Overview</div><button class="btn ghost" onclick="openModal('help')">Support Centre</button></header><main class="main"><section class="head"><h1 id="pageTitle">Dashboard</h1><div class="actions" id="actions"></div></section><section class="content" id="content"></section></main></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalbox"><button class="btn dark small close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const nav={dashboard:['Overview'],training:['Modules','Add Module','Assignments'],phishing:['Schedule','Templates','Consent','Results'],users:['Directory','Add User','Departments'],company:['Profile','Domains'],licences:['Plan','Trial'],reports:['Dashboard','User Report','Compliance','Exports'],policies:['Library','Acknowledgement'],settings:['Theme','SMTP','System Emails','Security']};
const labels={dashboard:'Dashboard',training:'Training',phishing:'Phishing',users:'Users',company:'Company',licences:'Licences',reports:'Reports',policies:'Policies',settings:'Settings'};const icons={dashboard:'▦',training:'▻',phishing:'♩',users:'◎',company:'▣',licences:'⚿',reports:'↗',policies:'▤',settings:'⚙'};let current='dashboard',sub='Overview';
const seed={users:[{id:1,name:'Asha Rao',email:'asha@demo.com',dept:'Finance',role:'Learner',risk:'Medium',score:82},{id:2,name:'Rohit Mehta',email:'rohit@demo.com',dept:'IT',role:'Admin',risk:'Low',score:94},{id:3,name:'Meera Shah',email:'meera@demo.com',dept:'HR',role:'Manager',risk:'Low',score:89},{id:4,name:'Priya Nair',email:'priya@demo.com',dept:'Sales',role:'Learner',risk:'High',score:61}],modules:[{id:1,title:'DPDPA Awareness',type:'Interactive Modules',cat:'Privacy',level:'Beginner',color:'#1e5d9e',emoji:'🇮🇳'},{id:2,title:'Phishing Basics',type:'Interactive Modules',cat:'Email',level:'Beginner',color:'#ff5545',emoji:'🎣'},{id:3,title:'RBI / BFSI Cyber Awareness',type:'Interactive Modules',cat:'Compliance',level:'Intermediate',color:'#111827',emoji:'🏦'},{id:4,title:'NIST CSF Basics',type:'Videos',cat:'Framework',level:'Expert',color:'#4338ca',emoji:'🧭'}],templates:[{id:1,name:'Password Expiry',subject:'Urgent: Your mailbox password expires today',difficulty:'Intermediate',body:'Verify your mailbox using the approved training link.'},{id:2,name:'Vendor Bank Change',subject:'Updated bank details for pending invoice',difficulty:'Expert',body:'Please process pending payment to the updated account.'}],campaigns:[{id:1,name:'July Password Expiry Drill',templateId:1,status:'Scheduled',date:'2026-07-30',time:'10:30',targets:[1,3],consent:true}],assignments:[{id:1,moduleId:1,userId:1,status:'Completed',score:92},{id:2,moduleId:2,userId:1,status:'In Progress',score:70},{id:3,moduleId:1,userId:2,status:'Completed',score:96}],policies:[{id:1,title:'Acceptable Use Policy',status:'Published'},{id:2,title:'Incident Reporting Policy',status:'Published'}],settings:{smtpHost:'smtp.company.com',sender:'training@company.com',theme:'dark'}};
function db(){let d=localStorage.getItem('kv360db');if(!d){localStorage.setItem('kv360db',JSON.stringify(seed));return structuredClone(seed)}return JSON.parse(d)}function save(d){localStorage.setItem('kv360db',JSON.stringify(d));}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function init(){mainNav.innerHTML=Object.keys(nav).map(k=>`<button class="${k===current?'active':''}" data-main="${k}"><span class="ico">${icons[k]}</span><span>${labels[k]}</span></button>`).join('');document.querySelectorAll('#mainNav button').forEach(b=>b.onclick=()=>{current=b.dataset.main;sub=nav[current][0];render()});render()}function renderSub(){subTitle.textContent=labels[current];subNav.innerHTML=nav[current].map(x=>`<button class="${x===sub?'active':''}" data-sub="${x}">${x}</button>`).join('');document.querySelectorAll('#subNav button').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()})}
function render(){const d=db();document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.main===current));renderSub();pageTitle.textContent=labels[current];crumb.textContent=labels[current]+' / '+sub;actions.innerHTML=pageActions();content.innerHTML=view(d);bindForms()}function pageActions(){if(current==='reports')return '<button class="btn dark" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="exportPDF()">Export PDF</button>';if(current==='phishing'&&sub==='Schedule')return '<button class="btn" onclick="document.getElementById(\'campaignForm\')?.requestSubmit()">Schedule</button>';return ''}
function view(d){if(current==='dashboard')return dashboard(d);if(current==='training')return training(d);if(current==='users')return users(d);if(current==='phishing')return phishing(d);if(current==='reports')return reports(d);if(current==='settings')return settings(d);if(current==='company')return company(d);if(current==='licences')return licences(d);if(current==='policies')return policies(d);return '<div class="panel">Ready</div>'}
function dashboard(d){let completed=d.assignments.filter(a=>a.status==='Completed').length;let clickRate=6.8;return `<div class="grid metrics"><div class="card metric"><span>Users</span><b>${d.users.length}</b></div><div class="card metric"><span>Modules</span><b>${d.modules.length}</b></div><div class="card metric"><span>Completions</span><b>${completed}</b></div><div class="card metric"><span>Click Rate</span><b>${clickRate}%</b></div></div><div class="grid two" style="margin-top:20px"><div class="panel"><h2>Priority Actions</h2>${d.users.filter(u=>u.risk==='High').map(u=>`<div class="row">${u.name} needs retraining <span class="tag bad">High</span></div>`).join('')||'<div class="row">No high-risk actions <span class="tag">OK</span></div>'}<div class="row">${d.campaigns.length} campaign(s) active <span class="tag warn">Review</span></div></div><div class="panel"><h2>Recent Campaigns</h2>${d.campaigns.map(c=>`<div class="row">${c.name} <span class="tag warn">${c.status}</span></div>`).join('')}</div></div>`}
function moduleCard(m){return `<article class="module"><div class="cover" style="background:${m.color}"><strong>${m.title.split(' ')[0]}<br>${m.title.split(' ')[1]||''}</strong><em>${m.emoji}</em></div><div class="body"><b>${m.title}</b><span>${m.type}</span><span>${m.level}</span></div></article>`}
function training(d){if(sub==='Modules')return `<div class="modules">${d.modules.map(moduleCard).join('')}</div><div class="notice">Content is view-only. Downloads are disabled in UI and should be enforced by signed URLs in production.</div>`;if(sub==='Add Module')return `<div class="panel"><h2>Add Training Module</h2><form class="form" id="moduleForm"><input name="title" placeholder="Module title" required><select name="type"><option>Interactive Modules</option><option>Videos</option><option>Quizzes</option></select><select name="level"><option>Beginner</option><option>Intermediate</option><option>Expert</option></select><input name="cat" placeholder="Category"><button class="btn">Add Module</button></form></div>`;return `<div class="panel"><h2>Assignments</h2><form class="form" id="assignForm"><select name="userId">${d.users.map(u=>`<option value="${u.id}">${u.name}</option>`)}</select><select name="moduleId">${d.modules.map(m=>`<option value="${m.id}">${m.title}</option>`)}</select><button class="btn">Assign Module</button></form><br><table class="table"><tr><th>User</th><th>Module</th><th>Status</th></tr>${d.assignments.map(a=>`<tr><td>${name(d,a.userId)}</td><td>${mod(d,a.moduleId)}</td><td>${a.status}</td></tr>`).join('')}</table></div>`}
function users(d){if(sub==='Add User')return `<div class="panel"><h2>Add User</h2><form class="form" id="userForm"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="dept" placeholder="Department"><select name="role"><option>Learner</option><option>Admin</option><option>Manager</option><option>Content Creator</option></select><button class="btn">Add User</button></form></div>`;if(sub==='Departments')return `<div class="panel"><h2>Departments</h2>${[...new Set(d.users.map(u=>u.dept))].map(dep=>`<div class="row">${dep}<span>${d.users.filter(u=>u.dept===dep).length} users</span></div>`).join('')}</div>`;return `<div class="panel"><h2>User Directory</h2><table class="table"><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Risk</th><th></th></tr>${d.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.dept}</td><td>${u.role}</td><td><span class="tag ${u.risk==='High'?'bad':u.risk==='Medium'?'warn':''}">${u.risk}</span></td><td><button class="btn small ghost" onclick="deleteUser(${u.id})">Delete</button></td></tr>`).join('')}</table></div>`}
function phishing(d){if(sub==='Templates')return `<div class="grid two"><div class="panel"><h2>Add Template</h2><form class="form" id="templateForm"><input name="name" placeholder="Template name"><input name="subject" placeholder="Subject"><select name="difficulty"><option>Beginner</option><option>Intermediate</option><option>Expert</option></select><textarea name="body" placeholder="Email body"></textarea><button class="btn">Save Template</button></form></div><div class="panel"><h2>Templates</h2>${d.templates.map(t=>`<div class="row">${t.name}<span class="tag warn">${t.difficulty}</span></div>`).join('')}</div></div>`;if(sub==='Results')return `<div class="panel"><h2>Campaign Results</h2><table class="table"><tr><th>Campaign</th><th>Status</th><th>Targets</th><th>Click Rate</th><th>Report Rate</th></tr>${d.campaigns.map(c=>`<tr><td>${c.name}</td><td>${c.status}</td><td>${c.targets.length}</td><td>6.8%</td><td>47%</td></tr>`).join('')}</table></div>`;if(sub==='Consent')return `<div class="panel"><h2>Consent Checklist</h2><div class="checks"><label class="check"><input type="checkbox" checked> Management approval obtained</label><label class="check"><input type="checkbox" checked> HR/legal reviewed scope</label><label class="check"><input type="checkbox" checked> No real credential collection</label><label class="check"><input type="checkbox"> Final customer admin approval</label></div></div>`;return `<div class="panel"><h2>Schedule Campaign</h2><form class="form" id="campaignForm"><input name="name" placeholder="Campaign name" required><select name="templateId">${d.templates.map(t=>`<option value="${t.id}">${t.name}</option>`)}</select><input name="date" type="date" required><input name="time" type="time" required><input name="domain" value="training.customer-domain.com"><textarea name="note">Consent note: approved internal training simulation. No real credentials collected.</textarea><label>Assign Users</label>${d.users.map(u=>`<label class="check"><input type="checkbox" name="targets" value="${u.id}"> ${u.name} — ${u.dept}</label>`).join('')}<button class="btn">Schedule Campaign</button></form></div>`}
function reports(d){if(sub==='User Report'){let u=d.users[0];return `<div class="grid two"><div class="panel"><h2>${u.name}</h2><div class="metric"><span>Cyber Score</span><b>${u.score}</b></div><div class="row">Department <span>${u.dept}</span></div><div class="row">Risk <span class="tag warn">${u.risk}</span></div></div><div class="panel"><h2>Activity</h2><div class="row">Training completed <span>9 / 11</span></div><div class="row">Phishing clicked <span class="tag warn">1 / 5</span></div><div class="row">Reported phishing <span class="tag">3 / 5</span></div><div class="row">Certificates <span>Silver + DPDPA</span></div></div></div>`}return `<div class="grid metrics"><div class="card metric"><span>Training</span><b>84%</b></div><div class="card metric"><span>Click Rate</span><b>6.8%</b></div><div class="card metric"><span>Report Rate</span><b>47%</b></div><div class="card metric"><span>Avg Time</span><b>18m</b></div></div><div class="panel" style="margin-top:20px"><h2>${sub}</h2><div class="row">DPDPA <span>92%</span></div><div class="row">RBI/BFSI <span>76%</span></div><div class="row">NIST CSF <span>68%</span></div></div>`}
function settings(d){return `<div class="panel"><h2>${sub}</h2><form class="form" id="settingsForm"><input name="smtpHost" value="${d.settings.smtpHost}" placeholder="SMTP host"><input name="sender" value="${d.settings.sender}" placeholder="Sender email"><select name="theme"><option ${d.settings.theme==='dark'?'selected':''}>dark</option><option>light</option><option>premium</option></select><button class="btn">Save Settings</button></form></div>`}
function company(d){return `<div class="panel"><h2>${sub}</h2><div class="row">Company <span>Kavach360 Demo Customer</span></div><div class="row">Training Domain <span>training.company.com</span></div><div class="row">SMTP Domain <span>smtp.company.com</span></div></div>`}function licences(d){return `<div class="grid metrics"><div class="card metric"><span>Plan</span><b>Pro</b></div><div class="card metric"><span>Users</span><b>${d.users.length}</b></div><div class="card metric"><span>Expiry</span><b>127d</b></div><div class="card metric"><span>Trial</span><b>Extend</b></div></div>`}function policies(d){return `<div class="panel"><h2>Policies</h2>${d.policies.map(p=>`<div class="row">${p.title}<span class="tag">${p.status}</span></div>`).join('')}</div>`}
function bindForms(){document.getElementById('userForm')?.addEventListener('submit',e=>{e.preventDefault();let d=db(),f=new FormData(e.target);d.users.push({id:Date.now(),name:f.get('name'),email:f.get('email'),dept:f.get('dept')||'General',role:f.get('role'),risk:'Low',score:0});save(d);toast('User added');render()});document.getElementById('moduleForm')?.addEventListener('submit',e=>{e.preventDefault();let d=db(),f=new FormData(e.target);d.modules.push({id:Date.now(),title:f.get('title'),type:f.get('type'),level:f.get('level'),cat:f.get('cat'),color:'#ff5545',emoji:'🎓'});save(d);toast('Module added');render()});document.getElementById('templateForm')?.addEventListener('submit',e=>{e.preventDefault();let d=db(),f=new FormData(e.target);d.templates.push({id:Date.now(),name:f.get('name'),subject:f.get('subject'),difficulty:f.get('difficulty'),body:f.get('body')});save(d);toast('Template saved');render()});document.getElementById('campaignForm')?.addEventListener('submit',e=>{e.preventDefault();let d=db(),f=new FormData(e.target);d.campaigns.push({id:Date.now(),name:f.get('name'),templateId:+f.get('templateId'),status:'Scheduled',date:f.get('date'),time:f.get('time'),targets:f.getAll('targets').map(Number),consent:true});save(d);toast('Campaign scheduled');render()});document.getElementById('assignForm')?.addEventListener('submit',e=>{e.preventDefault();let d=db(),f=new FormData(e.target);d.assignments.push({id:Date.now(),userId:+f.get('userId'),moduleId:+f.get('moduleId'),status:'Assigned',score:0});save(d);toast('Module assigned');render()});document.getElementById('settingsForm')?.addEventListener('submit',e=>{e.preventDefault();let d=db(),f=new FormData(e.target);d.settings.smtpHost=f.get('smtpHost');d.settings.sender=f.get('sender');d.settings.theme=f.get('theme');save(d);toast('Settings saved')})}
function name(d,id){return d.users.find(u=>u.id==id)?.name||'Unknown'}function mod(d,id){return d.modules.find(m=>m.id==id)?.title||'Unknown'}function deleteUser(id){let d=db();d.users=d.users.filter(u=>u.id!==id);save(d);toast('User deleted');render()}function exportDB(){let blob=new Blob([JSON.stringify(db(),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kavach360-demo-db.json';a.click()}function resetDB(){localStorage.removeItem('kv360db');toast('Demo DB reset');render()}function exportCSV(){toast('CSV export generated')}function exportPDF(){toast('PDF export generated')}function openModal(){modal.classList.add('show');modalContent.innerHTML='<h2>Support Centre</h2><p>Book demo, raise ticket, view FAQ, or contact security support.</p>'}function closeModal(){modal.classList.remove('show')}
init();
</script></body></html>
