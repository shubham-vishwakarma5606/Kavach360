<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kavach360 — Final Clean GoldPhish-style Structure</title>
  <style>
    :root{--bg:#070a02;--side:#25283b;--sideDark:#202337;--panel:#282b40;--panel2:#30344b;--text:#fff;--muted:#cbd0df;--muted2:#9198ae;--accent:#ff5847;--purple:#a020f0;--line:rgba(255,255,255,.08);--shadow:0 14px 34px rgba(0,0,0,.34);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:250px 230px 1fr;grid-template-rows:72px 1fr;height:100vh}.sidebar{grid-row:1/3;background:var(--side);border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column}.side-top{height:72px;display:flex;align-items:center;gap:20px;padding:0 18px}.hamb{width:34px;border:0;background:transparent;display:grid;gap:6px}.hamb span{height:3px;background:#fff;border-radius:99px}.logo{width:58px;height:35px;background:#fff;border-radius:3px;color:#5b21b6;font-size:8px;font-weight:1000;display:grid;place-items:center;text-align:center;line-height:1.05}.mainnav{padding-top:30px;display:grid}.mainnav button{height:70px;border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:23px;padding:0 28px;text-align:left;font-size:18px;position:relative}.mainnav button:hover{background:rgba(255,255,255,.035)}.mainnav button.active{background:rgba(255,88,71,.66)}.mainnav button.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}.ico{font-size:29px;width:30px;text-align:center}.side-utils{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:9px}.utility{border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;border-radius:8px;padding:10px 12px;text-align:left;font-weight:800}.profile{display:flex;align-items:center;gap:10px;font-weight:900;padding:10px 2px}.avatar{width:34px;height:34px;border-radius:50%;background:#8b1cf6;display:grid;place-items:center}.subbar{grid-row:1/3;background:#1f2234;border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column}.sub-head{height:72px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line);font-weight:900;color:#fff}.subnav{display:grid;padding:16px 12px;gap:7px}.subnav button{height:46px;border:0;background:transparent;color:#d7dae8;text-align:left;border-radius:8px;padding:0 14px;font-size:15px;font-weight:750}.subnav button:hover{background:rgba(255,255,255,.05)}.subnav button.active{background:rgba(255,88,71,.66);color:#fff}.topbar{grid-column:3;background:var(--side);display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.04)}.crumb{color:var(--muted2);font-weight:800}.top-actions{display:flex;align-items:center;gap:18px}.support{border:0;background:transparent;color:#fff;font-weight:900}.main{grid-column:3;overflow:auto;background:var(--bg)}.page-head{height:112px;background:#080d02;display:flex;align-items:center;justify-content:space-between;padding:0 36px}.page-head h1{margin:0;font-size:44px;font-weight:500;letter-spacing:-1px}.page-action{display:flex;gap:10px}.btn{border:0;border-radius:7px;padding:11px 17px;font-weight:900;color:#fff;background:var(--accent)}.btn.dark{background:#000}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.content{padding:28px 36px 50px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.panel{padding:22px}.panel h2{margin:0 0 16px}.grid{display:grid;gap:22px}.metrics{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.1fr .9fr}.metric{padding:22px}.metric span{color:var(--muted2);font-size:12px;text-transform:uppercase;font-weight:900;letter-spacing:.8px}.metric b{display:block;font-size:34px;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.tag{font-size:12px;border-radius:99px;padding:6px 10px;background:rgba(34,197,94,.15);color:#bbf7d0;font-weight:900}.warn{background:rgba(249,115,22,.16);color:#fed7aa}.bad{background:rgba(239,68,68,.16);color:#fecaca}.modules{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:28px 34px}.module{background:var(--panel);border-radius:7px;overflow:hidden;min-height:236px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.035);cursor:pointer;position:relative;transition:.16s}.module:hover{transform:translateY(-3px);box-shadow:0 18px 46px rgba(0,0,0,.46)}.cover{height:118px;position:relative;overflow:hidden}.cover-title{position:absolute;left:16px;top:15px;font-weight:1000;font-size:22px;line-height:1.02}.emoji{position:absolute;right:18px;bottom:12px;font-size:42px}.new{position:absolute;left:14px;top:0;transform:translateY(-5px);background:var(--accent);padding:6px 13px;border-radius:5px;font-size:14px;z-index:2}.flag{position:absolute;right:10px;top:9px;width:33px;height:33px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}.body{padding:19px 17px}.body b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body span{display:block;margin-top:10px;color:#e0e3f2;font-size:14px}.form{display:grid;gap:14px}.form input,.form select,.form textarea{background:#202337;border:1px solid var(--line);border-radius:8px;color:#fff;padding:13px;outline:none}.form textarea{min-height:92px}.settings-theme .step{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:18px}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.colorbox{height:38px;border-radius:5px;border:1px solid rgba(255,255,255,.14);margin-top:8px}.theme-row{display:flex;gap:28px;flex-wrap:wrap}.thumb{width:126px;height:60px;border:4px solid #606a78;border-radius:7px;background:#eee;position:relative}.thumb.dark{background:#080d02}.thumb:before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:#25283b}.thumb:after{content:"";position:absolute;left:0;top:30px;width:32px;height:4px;background:var(--accent)}.thumb.purple:before{background:linear-gradient(var(--purple) 0 50%,var(--accent) 50%)}.thumb.orange:before{background:linear-gradient(var(--accent) 0 50%,var(--purple) 50%)}.thumb.active{border-color:#aab6c7}.notice{margin-top:24px;border-left:4px solid var(--accent);background:rgba(255,255,255,.05);padding:15px;border-radius:8px;color:#e8eaf4;line-height:1.55}.toast{position:fixed;top:90px;right:28px;background:#22c55e;color:#04130a;font-weight:900;padding:12px 16px;border-radius:8px;opacity:0;transform:translateY(-12px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}
    @media(max-width:1280px){.app{grid-template-columns:220px 205px 1fr}.modules{grid-template-columns:repeat(4,minmax(160px,1fr))}.mainnav button{font-size:16px;gap:18px;padding:0 22px}.ico{font-size:26px}.metrics,.colors{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:980px){body{overflow:auto}.app{display:block;height:auto}.sidebar{position:sticky;top:0;z-index:20}.side-top{height:64px}.mainnav{display:flex;overflow:auto;padding:0}.mainnav button{min-width:116px;height:72px;flex-direction:column;justify-content:center;gap:5px;font-size:13px;padding:8px}.mainnav button.active:before{top:auto;right:0;width:auto;height:4px}.side-utils{display:none}.subbar{position:sticky;top:136px;z-index:18;display:block}.sub-head{display:none}.subnav{display:flex;overflow:auto;padding:10px}.subnav button{min-width:145px;text-align:center}.topbar{display:none}.main{overflow:visible}.modules{grid-template-columns:repeat(2,minmax(150px,1fr))}.metrics,.two,.colors{grid-template-columns:1fr}.page-head,.content{padding-left:20px;padding-right:20px}.page-head h1{font-size:36px}}
    @media(max-width:560px){.modules{grid-template-columns:1fr}.page-action{display:none}.cover{height:132px}.module{min-height:246px}}
  </style>
</head>
<body oncontextmenu="return false">
<div class="app">
  <aside class="sidebar">
    <div class="side-top"><button class="hamb"><span></span><span></span><span></span></button><div class="logo">KAVACH<br>360</div></div>
    <nav class="mainnav" id="mainNav"></nav>
    <div class="side-utils"><button class="utility" id="themeBtn">☾ Theme</button><button class="utility" id="supportBtn">🤖 Support Centre</button><div class="profile"><div class="avatar">NL</div><span>Ninad Lad</span></div></div>
  </aside>
  <aside class="subbar"><div class="sub-head" id="subTitle">Dashboard</div><nav class="subnav" id="subNav"></nav></aside>
  <header class="topbar"><div class="crumb" id="crumb">Dashboard / Overview</div><div class="top-actions"><button class="support">Support Centre</button><div class="avatar">NL</div></div></header>
  <main class="main"><section class="page-head"><h1 id="pageTitle">Dashboard</h1><div class="page-action" id="pageAction"></div></section><section class="content" id="content"></section></main>
</div><div class="toast" id="toast">Saved</div>
<script>
const nav={dashboard:['Overview'],training:['My Training','Campaigns','Content'],phishing:['Schedule','Templates','Consent','Results'],users:['Directory','Roles','Departments','Import'],company:['Profile','Branding','Domains'],licences:['Plan','Trial','Extensions'],reports:['Dashboard','User Report','Departments','Compliance','Exports'],policies:['Acknowledgement','Library','Versions'],settings:['Theme','Company Logo','System Emails','User Sync','SSO','Logs','Reminders','SMTP','Security']};
const labels={dashboard:'Dashboard',training:'Training',phishing:'Phishing',users:'Users',company:'Company',licences:'Licences',reports:'Reports',policies:'Policies',settings:'Settings'};
const icons={dashboard:'▦',training:'▻',phishing:'♩',users:'◎',company:'▣',licences:'⚿',reports:'↗',policies:'▤',settings:'⚙'};
let current='dashboard',sub='Overview';
mainNav.innerHTML=Object.keys(nav).map(k=>`<button class="${k===current?'active':''}" data-main="${k}"><span class="ico">${icons[k]}</span><span>${labels[k]}</span></button>`).join('');
function renderSub(){subTitle.textContent=labels[current];subNav.innerHTML=nav[current].map((x,i)=>`<button class="${x===sub||(!nav[current].includes(sub)&&i===0)?'active':''}" data-sub="${x}">${x}</button>`).join('');document.querySelectorAll('#subNav button').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()})}
function render(){if(!nav[current].includes(sub))sub=nav[current][0];document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.main===current));renderSub();pageTitle.textContent=labels[current];crumb.textContent=labels[current]+' / '+sub;pageAction.innerHTML=actions();content.innerHTML=view();bind()}
function actions(){if(current==='settings')return '<button class="btn dark" data-toast="Reset done">Reset</button><button class="btn" data-toast="Settings saved">Save</button>';if(current==='phishing')return '<button class="btn dark" data-toast="Draft saved">Save Draft</button><button class="btn" data-toast="Campaign scheduled">Schedule</button>';if(current==='reports')return '<button class="btn dark" data-toast="CSV export started">Export CSV</button><button class="btn" data-toast="PDF export started">Export PDF</button>';return ''}
function modules(){const m=[['#ff5545','#1 OT Security: The Basics','Interactive Modules','🔌',0],['#8b1cf6','#2 Cyber Readiness','Quizzes','🎯',0],['#ff5545','#2 OT Security: In The Field','Interactive Modules','👷',0],['#18c957','Beyond Passwords','Interactive Modules','🔐',0],['#1e5d9e','DPDPA','Interactive Modules','🇮🇳',1],['#111827','RBI / BFSI Cyber Awareness','Interactive Modules','🏦',1],['#0f766e','SEBI Market Entity Awareness','Interactive Modules','📈',1],['#4338ca','NIST CSF Basics','Interactive Modules','🧭',1],['#be123c','Red Team / Blue Team Concepts','Videos','⚔️',1],['#ea580c','Incident Reporting & MTTR','Interactive Modules','⏱️',1]];return `<div class="modules">${m.map(x=>`<article class="module">${x[4]?'<div class="new">New</div>':''}<div class="cover" style="background:${x[0]}"><svg viewBox="0 0 400 180" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><path d="M0 145 C90 80 150 210 250 120 S360 40 400 120 V180 H0z" fill="rgba(0,0,0,.16)"/><circle cx="335" cy="52" r="45" fill="rgba(255,255,255,.18)"/></svg><div class="cover-title">${x[1].split(':')[0]}</div><div class="emoji">${x[3]}</div></div><div class="flag">🇬🇧</div><div class="body"><b>${x[1]}</b><span>${x[2]}</span></div></article>`).join('')}</div><div class="notice"><b>Content protection:</b> modules are view-only. Production uses private storage, signed streaming URLs, watermarking and backend authorization.</div>`}
function view(){
 if(current==='training')return modules();
 if(current==='dashboard')return `<div class="grid metrics"><div class="card metric"><span>Completion</span><b>84%</b></div><div class="card metric"><span>Assigned</span><b>42</b></div><div class="card metric"><span>Click Rate</span><b>6.8%</b></div><div class="card metric"><span>Report Rate</span><b>47%</b></div></div><div class="grid two" style="margin-top:22px"><div class="panel"><h2>Priority Actions</h2><div class="row">DPDPA module due this week <span class="tag bad">High</span></div><div class="row">Finance needs vendor fraud refresher <span class="tag warn">Medium</span></div><div class="row">SMTP test passed <span class="tag">OK</span></div></div><div class="panel"><h2>Latest Activity</h2><div class="row">Campaign report generated <span>Today</span></div><div class="row">3 users completed Gold certificate <span>Today</span></div></div></div>`;
 if(current==='phishing')return `<div class="grid two"><div class="panel"><h2>Campaign Schedule & Assignment</h2><form class="form"><input value="Password Expiry Simulation - July"><select><option>Password Expiry</option><option>Vendor Bank Change</option><option>DPDPA Audit Request</option></select><input type="date" value="2026-07-30"><input type="time" value="10:30"><input value="training.customer-domain.com"><textarea>Consent note: approved internal training simulation. No real credentials collected.</textarea></form></div><div class="panel"><h2>Consent Checklist</h2><div class="row">Management approval <span class="tag">Done</span></div><div class="row">HR/legal review <span class="tag">Done</span></div><div class="row">Final admin approval <span class="tag warn">Pending</span></div><div class="row">Assigned users <span>Finance + HR</span></div></div></div>`;
 if(current==='reports')return `<div class="grid metrics"><div class="card metric"><span>Training</span><b>84%</b></div><div class="card metric"><span>Click Rate</span><b>6.8%</b></div><div class="card metric"><span>Report Rate</span><b>47%</b></div><div class="card metric"><span>Avg Time</span><b>18m</b></div></div><div class="grid two" style="margin-top:22px"><div class="panel"><h2>Individual User Report</h2><div class="row">Asha Rao — Cyber Score <span>82</span></div><div class="row">Training Completed <span>9 / 11</span></div><div class="row">Phishing Clicks <span class="tag warn">1 / 5</span></div><div class="row">Reported Phishing <span class="tag">3 / 5</span></div></div><div class="panel"><h2>Department Risk</h2><div class="row">Finance <span class="tag bad">High</span></div><div class="row">HR <span class="tag warn">Medium</span></div><div class="row">IT <span class="tag">Low</span></div></div></div>`;
 if(current==='settings'&&sub==='Theme')return `<div class="settings-theme"><div class="step"><h2>Step 1: Select Main Colors</h2><div class="colors"><div>Primary<div class="colorbox" style="background:#ff5847"></div></div><div>Primary Text<div class="colorbox" style="background:#fff"></div></div><div>Secondary<div class="colorbox" style="background:#a020f0"></div></div><div>Secondary Text<div class="colorbox" style="background:#edf1f8"></div></div></div></div><div class="step"><h2>Step 2: Select Light Theme</h2><div class="theme-row"><div class="thumb active"></div><div class="thumb"></div><div class="thumb purple"></div><div class="thumb orange"></div></div></div><div class="step"><h2>Step 3: Select Dark Theme</h2><div class="theme-row"><div class="thumb dark active"></div><div class="thumb dark"></div><div class="thumb dark purple"></div><div class="thumb dark orange"></div></div></div></div>`;
 if(current==='users')return `<div class="panel"><h2>${sub}</h2><div class="row">Asha Rao — Finance <span class="tag warn">Retraining</span></div><div class="row">Rohit Mehta — IT Admin <span class="tag">Active</span></div><div class="row">Meera Shah — HR Manager <span class="tag">Active</span></div></div>`;
 return `<div class="panel"><h2>${labels[current]} — ${sub}</h2><p style="color:var(--muted);line-height:1.7">Clean single-purpose workspace for this section. Only the selected sub-feature appears here, keeping the UI uncluttered.</p><div class="row">Status <span class="tag">Ready</span></div><div class="row">Access <span>Customer Admin</span></div></div>`;
}
function bind(){document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));document.querySelectorAll('.thumb').forEach(t=>t.onclick=()=>{t.parentElement.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));t.classList.add('active');toast('Theme selected')})}
document.querySelectorAll('#mainNav button').forEach(b=>b.onclick=()=>{current=b.dataset.main;sub=nav[current][0];render()});themeBtn.onclick=()=>toast('Theme shortcut');supportBtn.onclick=()=>toast('Support Centre');function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}render();
</script>
</body>
</html>
